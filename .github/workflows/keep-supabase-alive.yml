name: Keep Supabase Alive

on:
  schedule:
    # Run every 3 days at 09:00 UTC (16:00 GMT+7) to prevent Supabase Free tier auto-pause
    - cron: '0 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping blog API to keep Supabase active
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "https://thetalkofthomas.vercel.app/api/posts?ping=$(date +%s)")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Ping failed with status $STATUS"
            exit 1
          fi
